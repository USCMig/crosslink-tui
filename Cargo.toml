[package]
name = "crosslink-tui"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Terminal UI for running a Crosslink (zebrad) node"
repository = "https://github.com/USCMig/crosslink-tui"

[dependencies]
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
strip = true
